# Netlify: set the site's base directory to `sound-toy` (this file is read from there).
[build]
  command = "npm run build"
  publish = "dist"
  # Skip deploys when a commit doesn't touch this project (other labs live in the same repo).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints everything under assets/, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
